<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能客服小云</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="chat-app">
      <header class="chat-header">
        <div class="brand">
          <span class="logo">🤖</span>
          <div>
            <div class="brand-name">智能客服小云</div>
            <div class="brand-sub">7×24 在线 · 多轮对话 · FAQ 检索</div>
          </div>
        </div>
        <div class="header-actions">
          <span id="intentBadge" class="badge" style="display: none"></span>
          <button id="newChatBtn" class="btn-ghost">新建对话</button>
          <a href="admin.html" class="btn-ghost">管理后台</a>
        </div>
      </header>

      <main id="messages" class="messages" role="log" aria-live="polite" aria-label="对话记录"></main>

      <div id="transferPanel" class="transfer-panel" style="display: none">
        <div class="transfer-title">🙋 转人工服务</div>
        <div id="transferNote" class="transfer-note"></div>
        <div id="transferForm" class="transfer-form">
          <input id="contactName" type="text" placeholder="您的称呼" />
          <input id="contactPhone" type="text" placeholder="联系电话" />
          <button id="transferSubmit" class="btn-primary">提交并等待联系</button>
        </div>
      </div>

      <div id="satPanel" class="sat-panel">
        <span class="sat-label">本次服务是否满意？（1~5 星）</span>
        <div class="stars" id="stars" role="radiogroup" aria-label="满意度评分">
          <button class="star" data-v="1" aria-label="1 星" title="1 星">★</button>
          <button class="star" data-v="2" aria-label="2 星" title="2 星">★</button>
          <button class="star" data-v="3" aria-label="3 星" title="3 星">★</button>
          <button class="star" data-v="4" aria-label="4 星" title="4 星">★</button>
          <button class="star" data-v="5" aria-label="5 星" title="5 星">★</button>
        </div>
        <span id="satThanks" class="sat-thanks" style="display: none">感谢您的反馈！</span>
      </div>

      <footer class="composer">
        <textarea id="input" rows="1" placeholder="输入您的问题，回车发送（Shift+回车换行）"></textarea>
        <button id="sendBtn" class="btn-primary">发送</button>
      </footer>
    </div>

    <script src="js/faq-data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/cloud.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
